// This file is intentionally minimal.
// The full android/ directory is generated by `flutter create` in CI.
// Only app/src/main/AndroidManifest.xml and this file are committed to the repo
// to avoid binary assets (mipmap PNGs, etc.) in version control.
// See .github/workflows/build-flutter-apk.yml for how the CI assembles
// the complete project before running `flutter build apk`.

plugins {
    id "com.android.application"
    id "kotlin-android"
    // Apply the Flutter Gradle Plugin as the last step.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) flutterVersionCode = "1"

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) flutterVersionName = "1.0.0"

android {
    namespace "com.eclipsecam.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId "com.eclipsecam.app"
        // CameraAwesome v2 requires minSdk 21 (Android 5.0)
        minSdk = 21
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            signingConfig signingConfigs.debug
            // Disable minification to avoid stripping CameraAwesome native code
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

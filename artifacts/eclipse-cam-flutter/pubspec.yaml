name: eclipse_cam
description: Contrôleur automatique de séquences photos pour éclipse solaire
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  # Caméra avec contrôle Camera2 réel (ISO, temps de pose, focus verrouillé)
  camerawesome: ^2.1.0
  # Gestion d'état
  provider: ^6.1.2
  # Persistance locale
  shared_preferences: ^2.2.3
  # Partage de fichiers
  share_plus: ^9.0.0
  # Sauvegarde galerie (MediaStore Android 10+)
  gal: ^2.2.0
  # Répertoires temporaires
  path_provider: ^2.1.3
  # Identifiants uniques
  uuid: ^4.4.0
  # Utilitaires collections
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

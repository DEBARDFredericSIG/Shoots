name: Build Eclipse Cam APK

on:
  push:
    branches: [main, master]
    paths:
      - 'artifacts/eclipse-cam/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/eclipse-cam

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('artifacts/eclipse-cam/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Expo CLI
        run: pnpm add -g @expo/cli

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          NODE_ENV: production

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
          NODE_ENV: production

      - name: Find APK
        run: find android -name "*.apk" | head -10

      - name: Upload APK (release)
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-cam-release
          path: artifacts/eclipse-cam/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

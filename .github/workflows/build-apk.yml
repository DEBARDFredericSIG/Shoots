name: Build Eclipse Cam APK

on:
  push:
    branches: [main, master]
    paths:
      - 'artifacts/eclipse-cam/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    defaults:
      run:
        working-directory: artifacts/eclipse-cam

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck Eclipse Cam
        run: pnpm run typecheck

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo prebuild (generate native Android project)
        run: pnpm exec expo prebuild --platform android --clean --no-install --non-interactive

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload Android reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-cam-android-reports
          path: |
            artifacts/eclipse-cam/android/**/build/reports/**
            artifacts/eclipse-cam/android/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Find APK
        run: find android -name "*.apk" | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-cam-release
          path: artifacts/eclipse-cam/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
